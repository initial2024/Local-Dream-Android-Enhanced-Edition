name: Signed basic release — native and certificate gates

on:
  # Test-only signed artifact when the reviewed native hardening changes
  # reach main. This is not a published GitHub Release or a phone benchmark.
  push:
    branches: [main]
    paths:
      - 'app/src/main/java/**'
      - 'app/src/main/res/**'
      - 'app/src/test/**'
      - 'app/build.gradle.kts'
      - 'app/src/main/cpp/src/PipelineSd15Cpu.hpp'
      - 'app/src/main/cpp/mnn_only/**'
      - 'app/src/main/java/io/github/xororz/localdream/service/BackendService.kt'
      - '.github/workflows/release-basic.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signed-basic-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    steps:
      - name: Checkout original source and enhancement code
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false

      - name: Gate 0 — protect known-good lowmem input ordering
        shell: bash
        run: |
          set -euo pipefail
          python3 enhanced/check_lowmem_quality_contract.py

      - name: Checkout only open-source dependencies used by MNN native build
        shell: bash
        run: |
          set -euo pipefail
          git submodule update --init --recursive --jobs 4 \
            app/src/main/cpp/3rdparty/MNN \
            app/src/main/cpp/3rdparty/cpp-httplib \
            app/src/main/cpp/3rdparty/json \
            app/src/main/cpp/3rdparty/stb \
            app/src/main/cpp/3rdparty/tokenizers-cpp \
            app/src/main/cpp/3rdparty/xsimd \
            app/src/main/cpp/3rdparty/xtensor \
            app/src/main/cpp/3rdparty/xtensor-blas \
            app/src/main/cpp/3rdparty/xtl \
            app/src/main/cpp/3rdparty/zstd

      - name: Fix two pinned tokenizer Rust implicit autoref errors
        shell: bash
        run: |
          set -euo pipefail
          python3 enhanced/patch_tokenizers_rust.py

      - name: Remove untrusted unused FlatBuffers sample Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          # The pinned MNN submodule contains a FlatBuffers Android sample
          # wrapper rejected by the official Gradle wrapper allowlist.
          # Never execute it; verify its exact SHA256, then remove just the
          # sample JAR from this ephemeral CI checkout. Keep validation ON.
          SAMPLE="app/src/main/cpp/3rdparty/MNN/3rd_party/flatbuffers/samples/android/gradle/wrapper/gradle-wrapper.jar"
          EXPECTED="ee3739525a995bcb5601621a6e2daec1f183bbefc375743acc235cec33547e04"
          test -f "$SAMPLE"
          printf '%s  %s\n' "$EXPECTED" "$SAMPLE" | sha256sum --check --status
          rm -- "$SAMPLE"
          test ! -e "$SAMPLE"
          # The project wrapper MUST remain present for validation.
          test -s gradle/wrapper/gradle-wrapper.jar

      - name: Install Rust Android arm64 target
        shell: bash
        run: |
          set -euo pipefail
          rustc --version
          rustup target add aarch64-linux-android
          rustup target list --installed | grep -Fx aarch64-linux-android

      - name: Build Native SD1.5 MNN-only runtime from source
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "ndk;28.2.13676358" --channel=3
          cmake -S app/src/main/cpp/mnn_only -B "$RUNNER_TEMP/mnn-production" -G Ninja             -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/28.2.13676358/build/cmake/android.toolchain.cmake"             -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28             -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.10
          # Fail fast on C++ source/include errors before compiling hundreds of MNN objects.
          ninja -C "$RUNNER_TEMP/mnn-production" CMakeFiles/libstable_diffusion_core.so.dir/main_mnn.cpp.o
          cmake --build "$RUNNER_TEMP/mnn-production" --target libstable_diffusion_core.so --parallel 2
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp "$RUNNER_TEMP/mnn-production/bin/arm64-v8a/libstable_diffusion_core.so"             app/src/main/jniLibs/arm64-v8a/libstable_diffusion_core.so
          NATIVE="app/src/main/jniLibs/arm64-v8a/libstable_diffusion_core.so"
          test -s "$NATIVE"
          # Remove only unnecessary native symbol/debug tables from the
          # signed test APK. Keep original unstripped CI artifact for diagnosis.
          BEFORE="$(stat -c%s "$NATIVE")"
          "$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"             --strip-unneeded "$NATIVE"
          AFTER="$(stat -c%s "$NATIVE")"
          test -s "$NATIVE"
          test "$AFTER" -le "$BEFORE"
          echo "Native size before/after safe symbol stripping: $BEFORE -> $AFTER bytes"

      - name: Gate 1 — real Android native inference core required
        shell: bash
        run: |
          set -euo pipefail
          NATIVE="app/src/main/jniLibs/arm64-v8a/libstable_diffusion_core.so"
          if [ ! -s "$NATIVE" ]; then
            echo "::error::Native inference core missing. Build from appropriately licensed dependencies first."
            exit 1
          fi
          file "$NATIVE"
          file "$NATIVE" | grep -q 'ELF 64-bit.*ARM aarch64'
          sha256sum "$NATIVE"
          "$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"             -d "$NATIVE" > "$RUNNER_TEMP/native-dependencies.txt"
          echo 'Native dynamic dependency audit:'
          grep 'NEEDED' "$RUNNER_TEMP/native-dependencies.txt" || true
          if grep -E 'NEEDED.*(libQnn|libcdsprpc|libdit_engine)'             "$RUNNER_TEMP/native-dependencies.txt"; then
            echo '::error::MNN-only native core unexpectedly requires Qualcomm runtime'
            exit 1
          fi

      - name: Gate 2 — fixed signing secrets must be present
        shell: bash
        env:
          ANDROID_SIGNING_KEY_B64: ${{ secrets.ANDROID_SIGNING_KEY_B64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_SIGNING_KEY_B64"
          test -n "$ANDROID_STORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          mkdir -p "$HOME/.gradle"
          umask 077
          printf '%s' "$ANDROID_SIGNING_KEY_B64" | base64 --decode > "$RUNNER_TEMP/localdream-fixed-release.jks"
          test -s "$RUNNER_TEMP/localdream-fixed-release.jks"
          {
            printf 'RELEASE_STORE_FILE=%s\n' "$RUNNER_TEMP/localdream-fixed-release.jks"
            printf 'RELEASE_STORE_PASSWORD=%s\n' "$ANDROID_STORE_PASSWORD"
            printf 'RELEASE_KEY_ALIAS=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'RELEASE_KEY_PASSWORD=%s\n' "$ANDROID_KEY_PASSWORD"
          } > "$HOME/.gradle/gradle.properties"
          chmod 600 "$HOME/.gradle/gradle.properties"

      - name: Setup JDK 17 and pinned Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Setup Android SDK 37.0 preview
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;36.0.0" --channel=3
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"

      - name: Compile, test, shrink and sign basicRelease
        shell: bash
        run: |
          set -euo pipefail
          python3 enhanced/apply_overlay.py --check
          gradle --no-daemon :app:testBasicDebugUnitTest :app:assembleBasicRelease

      - name: Gate 3 — verify package, native ABI, variant and fixed cert
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/basic/release -name '*.apk' -type f | head -n1)"
          test -n "$APK"
          test -s "$APK"
          test "$(find app/build/outputs/apk/basic/release -name '*.apk' -type f | wc -l)" -eq 1
          echo "APK=$APK" >> "$GITHUB_ENV"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -x "$AAPT"
          test -x "$APKSIGNER"
          "$AAPT" dump badging "$APK" | grep -F "package: name='io.github.initial2024.localdream.enhanced'"
          unzip -Z1 "$APK" > "$RUNNER_TEMP/apk-entries.txt"
          grep -Fxq 'lib/arm64-v8a/libstable_diffusion_core.so' "$RUNNER_TEMP/apk-entries.txt"
          if grep -E '^lib/arm64-v8a/libQnn' "$RUNNER_TEMP/apk-entries.txt"; then
            echo '::error::MNN-only APK packages unused Qualcomm QNN libraries'
            exit 1
          fi
          if grep -Fq 'libc++_shared.so' "$RUNNER_TEMP/native-dependencies.txt" &&
              ! grep -Fxq 'lib/arm64-v8a/libc++_shared.so' "$RUNNER_TEMP/apk-entries.txt"; then
            echo '::error::Native C++ runtime dependency is missing from APK'
            exit 1
          fi
          if grep -q 'safety_checker.mnn' "$RUNNER_TEMP/apk-entries.txt"; then
            echo "::error::The basic flavor unexpectedly contains filter weights."
            exit 1
          fi
          "$APKSIGNER" verify --print-certs "$APK" | tee "$RUNNER_TEMP/cert-report.txt"
          ACTUAL="$(awk -F': ' '/Signer #1 certificate SHA-256 digest/ {print toupper($2)}' "$RUNNER_TEMP/cert-report.txt")"
          EXPECTED='C903B3F6BDFA62E2BCB0E7F30534BB626FBA2715B35D6BF7BF80C768A8B103AA'
          test -n "$ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Wrong signing certificate; distribution is forbidden."
            exit 1
          fi
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Upload verified signed APK
        uses: actions/upload-artifact@v4
        with:
          name: LocalDreamEnhanced-basicRelease-signed-DEVICE-UNVERIFIED
          path: ${{ env.APK }}
          retention-days: 7
          if-no-files-found: error

      - name: Erase runner copy of private signing material
        if: always()
        shell: bash
        run: |
          rm -f "$HOME/.gradle/gradle.properties" "$RUNNER_TEMP/localdream-fixed-release.jks"
